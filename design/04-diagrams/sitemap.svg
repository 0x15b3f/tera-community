<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" width="1160" height="720" font-family="Cairo,'Noto Sans Arabic',sans-serif">
  <defs>
    <style>
      .b{fill:#fff;stroke:#17835B;stroke-width:2;rx:12}
      .dyn{fill:#FDF6E9;stroke:#C97F14;stroke-width:2}
      .adm{fill:#0F5138;stroke:#0B3B2C;stroke-width:2}
      .t{font-size:15px;font-weight:700;fill:#0B3B2C}
      .ts{font-size:10px;font-weight:600;fill:#71827A}
      .tw{font-size:15px;font-weight:700;fill:#fff}
      .l{stroke:#8FA598;stroke-width:2;fill:none}
      .cap{font-size:12px;fill:#71827A;font-weight:600}
    </style>
  </defs>
  <text x="580" y="26" text-anchor="middle" font-size="18" font-weight="900" fill="#0B3B2C">خريطة صفحات موقع تيره</text>

  <rect x="510" y="42" width="140" height="52" rx="14" fill="#0F5138" stroke="#0B3B2C" stroke-width="2"/>
  <text x="580" y="75" text-anchor="middle" class="tw">الرئيسية</text>

  <path class="l" d="M580 94 V118 M90 118 H1070"/>
  <path class="l" d="M90 118 V140 M230 118 V140 M370 118 V140 M510 118 V140 M650 118 V140 M790 118 V140 M930 118 V140 M1070 118 V140"/>

  <g>
    <rect x="28"  y="140" width="124" height="48" rx="12" class="b"/><text x="90"  y="170" text-anchor="middle" class="t">التصنيفات</text>
    <rect x="168" y="140" width="124" height="48" rx="12" class="b"/><text x="230" y="164" text-anchor="middle" class="t">التعليم</text><text x="230" y="181" text-anchor="middle" class="ts">مدرسين وسناتر</text>
    <rect x="308" y="140" width="124" height="48" rx="12" class="b"/><text x="370" y="170" text-anchor="middle" class="t">حواليك (خريطة)</text>
    <rect x="448" y="140" width="124" height="48" rx="12" class="b"/><text x="510" y="170" text-anchor="middle" class="t">العروض والإعلانات</text>
    <rect x="588" y="140" width="124" height="48" rx="12" class="b"/><text x="650" y="170" text-anchor="middle" class="t">المجتمع والأخبار</text>
    <rect x="728" y="140" width="124" height="48" rx="12" class="b"/><text x="790" y="170" text-anchor="middle" class="t">عن تيره</text>
    <rect x="868" y="140" width="124" height="48" rx="12" class="b"/><text x="930" y="170" text-anchor="middle" class="t">الشهداء</text>
    <rect x="1008" y="140" width="124" height="48" rx="12" class="adm"/><text x="1070" y="170" text-anchor="middle" class="tw">لوحة الأدمن</text>
  </g>

  <path class="l" d="M90 188 V224 M230 188 V224 M370 188 V224 M790 188 V224 M1070 188 V224"/>
  <rect x="28"  y="224" width="124" height="46" rx="12" class="dyn"/><text x="90"  y="252" text-anchor="middle" class="t">صفحة تصنيف</text>
  <rect x="168" y="224" width="124" height="46" rx="12" class="dyn"/><text x="230" y="245" text-anchor="middle" class="t" font-size="12">قائمة بفلاتر</text><text x="230" y="261" text-anchor="middle" class="ts">نوع · مادة · مرحلة</text>
  <rect x="308" y="224" width="124" height="46" rx="12" class="dyn"/><text x="370" y="252" text-anchor="middle" class="t">تفعيل اللوكيشن</text>
  <rect x="728" y="224" width="124" height="46" rx="12" class="dyn"/><text x="790" y="252" text-anchor="middle" class="t">تاريخ وإنجازات</text>
  <rect x="988" y="224" width="164" height="46" rx="12" class="adm"/><text x="1070" y="252" text-anchor="middle" class="tw">تسجيل دخول</text>

  <path class="l" d="M90 270 V304 M230 270 V304 M1070 270 V304"/>
  <rect x="28"  y="304" width="124" height="46" rx="12" class="dyn"/><text x="90"  y="332" text-anchor="middle" class="t">صفحة مكان</text>
  <rect x="168" y="304" width="124" height="46" rx="12" class="dyn"/><text x="230" y="325" text-anchor="middle" class="t" font-size="12">صفحة مدرس/سنتر</text><text x="230" y="341" text-anchor="middle" class="ts">مجموعات وأسعار</text>
  <rect x="988" y="304" width="164" height="46" rx="12" class="adm"/><text x="1070" y="326" text-anchor="middle" class="tw" font-size="12.5">إدارة: أماكن وتصنيفات</text><text x="1070" y="343" text-anchor="middle" class="tw" font-size="10" opacity=".8">عروض · أخبار · سواقين</text>

  <path class="l" d="M1070 350 V384"/>
  <rect x="988" y="384" width="164" height="46" rx="12" class="adm"/><text x="1070" y="406" text-anchor="middle" class="tw" font-size="12.5">صفحات القرية</text><text x="1070" y="423" text-anchor="middle" class="tw" font-size="10" opacity=".8">تاريخ · إنجازات · شهداء</text>

  <path class="l" d="M1070 430 V464"/>
  <rect x="988" y="464" width="164" height="46" rx="12" class="adm"/><text x="1070" y="486" text-anchor="middle" class="tw" font-size="12.5">التعليم</text><text x="1070" y="503" text-anchor="middle" class="tw" font-size="10" opacity=".8">مدرسين · سناتر · مواعيد</text>

  <g transform="translate(0,566)">
    <rect x="28" y="0" width="1104" height="120" rx="14" fill="#FAF7F0" stroke="#EAE4D6"/>
    <text x="1078" y="32" text-anchor="end" class="cap" font-weight="800" fill="#0B3B2C">دليل الألوان</text>
    <rect x="890" y="48" width="18" height="18" rx="5" class="b"/><text x="862" y="62" text-anchor="end" class="cap">صفحات عامة لكل الزوار</text>
    <rect x="580" y="48" width="18" height="18" rx="5" class="dyn"/><text x="552" y="62" text-anchor="end" class="cap">صفحات بتتولد من قاعدة البيانات</text>
    <rect x="300" y="48" width="18" height="18" rx="5" class="adm"/><text x="272" y="62" text-anchor="end" class="cap">خاصة بالأدمن فقط</text>
    <text x="1078" y="96" text-anchor="end" class="cap">صفحات التصنيفات الجديدة (موبايلات، عطارة، خدمات إلكترونية، إعلانات) بتتبنى بنفس قالب صفحة التصنيف وصفحة المكان.</text>
  </g>
</svg>
